name: Deploy to GitHub Pages

# Builds the static export (DEPLOY_TARGET=pages → basePath /aturseva-landing)
# and publishes it to GitHub Pages on every push to main. Manual runs possible
# via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build:pages
        env:
          DEPLOY_TARGET: pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Next 16 with a custom distDir writes the export into .next-pages
          path: .next-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
